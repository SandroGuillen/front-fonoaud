  <body>
    <!-- ======= Header ======= -->
    <header id="header" class="fixed-top">

      </div>

    <!-- ======= Contenido principal ======= -->
    <main class="math-game-container" style="margin-top: 100px">
      <div class="game-header text-center">
        <h2>Operaciones Matemáticas</h2>
        <p class="level-indicator">Nivel 1 - Básico</p>
        <div class="intentos-counter">
          <span>Intentos: </span>
          <span id="intentos-actual">0</span>
          <span>/10</span>
        </div>
      </div>

      <div class="operations-selector text-center my-4">
        <button id="suma" onclick="btnSumar()" class="operation-btn">
          <i class="fas fa-plus"></i>
          <span>Suma</span>
        </button>
        <button id="resta" onclick="btnResta()" class="operation-btn">
          <i class="fas fa-minus"></i>
          <span>Resta</span>
        </button>
        <button id="producto" onclick="btnProducto()" class="operation-btn">
          <i class="fas fa-times"></i>
          <span>Multiplicación</span>
        </button>
        <button id="division" onclick="btnDivision()" class="operation-btn">
          <i class="fas fa-divide"></i>
          <span>División</span>
        </button>
      </div>

      <div class="math-problem text-center">
        <div class="problem-display d-inline-flex align-items-center mb-3">
          <span id="num1" class="number me-2">0</span>
          <span id="operacion" class="operator me-2">+</span>
          <span id="num2" class="number me-2">0</span>
          <span class="equals me-2">=</span>
          <input
            type="text"
            id="respuesta_usuario"
            class="answer-input form-control d-inline-block"
            style="width: 80px"
            placeholder="?"
          />
        </div>
        <br />
        <button
          id="corregir"
          onclick="corregir()"
          class="check-btn btn btn-primary"
        >
          <i class="fas fa-check"></i> Verificar
        </button>
      </div>

      <div class="feedback-container text-center mt-4">
        <div id="msj_correccion" class="feedback-message mb-3"></div>
        <div class="stats d-flex justify-content-center gap-4">
          <div class="stat correct">
            <i class="fas fa-check-circle text-success"></i>
            <span id="correct-count">0</span>
          </div>
          <div class="stat incorrect">
            <i class="fas fa-times-circle text-danger"></i>
            <span id="incorrect-count">0</span>
          </div>
        </div>
      </div>

      <!-- ✅ Botón para finalizar el juego -->
      <div class="end-game-container text-center mt-4">
        <button id="endGameBtn" class="btn btn-danger">
          <i class="fas fa-flag-checkered"></i> Finalizar Juego
        </button>
      </div>
    </main>

    <!-- Scripts -->
    <script src="/juegos/matematica/matematica-nivel-1/index.js"></script>
